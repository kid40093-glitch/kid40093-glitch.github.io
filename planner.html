<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Plan · Student Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#12304f; --gold:#b8863b; --grey:#6b7385; --bg:#f4f6fa; --line:#e6e2da; --red:#b3261e; --green:#1e7a3c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--navy); }
  header { padding:16px; }
  header a { color:var(--navy); text-decoration:none; font-weight:500; }
  main { max-width:620px; margin:0 auto; padding:0 16px 50px; }
  h1 { font-size:28px; margin:8px 0 4px; }
  p.sub { color:var(--grey); margin:0 0 20px; font-size:17px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:24px; padding:20px; margin-bottom:14px; }
  .card h3 { margin:0 0 4px; font-size:18px; }
  .meta { color:var(--grey); font-size:14px; margin:0 0 6px; }
  .notes { color:var(--grey); font-size:15px; margin:6px 0 10px; }
  .chip { display:inline-block; background:#f3ead9; color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-right:6px; }
  .chip.late { background:#fbe4e2; color:var(--red); }
  .chip.soon { background:#fdf0d5; color:#9a6a12; }
  .chip.done { background:#e0f3e6; color:var(--green); }
  button { background:var(--navy); color:#fff; border:0; border-radius:12px; padding:10px 16px; font:inherit; font-weight:500; cursor:pointer; }
  button.gold { background:var(--gold); }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  .btn { background:var(--navy); color:#fff; border-radius:12px; padding:11px 16px; font-weight:500; text-decoration:none; display:inline-block; }
  input, select, textarea { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font:inherit; margin-bottom:10px; background:#fff; color:var(--navy); }
  label { font-size:13px; color:var(--grey); display:block; margin-bottom:4px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { flex:1; background:#fff; color:var(--navy); border:1px solid var(--line); }
  .tabs button.on { background:var(--navy); color:#fff; }
  #addForm { display:none; }
  #msg { font-size:14px; margin:4px 0 10px; color:var(--red); }
  .empty { text-align:center; color:var(--grey); padding:30px 10px; }
  .stats { display:flex; gap:10px; margin-bottom:14px; }
  .stat { flex:1; background:#fff; border:1px solid var(--line); border-radius:18px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:12px; color:var(--grey); }
  .done-title { text-decoration:line-through; color:var(--grey); }
</style>
</head>
<body>
<header><a href="index.html">← Student Hub</a></header>

<main>
  <h1>A plan for your progress</h1>
  <p class="sub">Assignments, projects and deadlines in one organized space.</p>

  <div id="gate" class="card" style="display:none">
    <h3>Log in to open your plan</h3>
    <p class="meta">Your plan is private to you.</p>
    <a class="btn" href="login.html">Log in</a>
  </div>

  <div id="app" style="display:none">
    <div class="stats">
      <div class="stat"><b id="sOpen">0</b><span>To do</span></div>
      <div class="stat"><b id="sLate">0</b><span>Overdue</span></div>
      <div class="stat"><b id="sDone">0</b><span>Done</span></div>
    </div>

    <div class="card"><button class="gold" id="toggleAdd">+ Add assignment or project</button></div>

    <form id="addForm" class="card">
      <h3>New task</h3>
      <label>Title</label>
      <input id="title" required maxlength="100" placeholder="e.g. Physics lab report">
      <div class="row">
        <div>
          <label>Type</label>
          <select id="kind"><option>Assignment</option><option>Project</option><option>Exam</option><option>Reading</option><option>Other</option></select>
        </div>
        <div>
          <label>Due date</label>
          <input id="due" type="date">
        </div>
      </div>
      <label>Subject (optional)</label>
      <input id="subject" maxlength="40" placeholder="e.g. Physics">
      <label>Notes (optional)</label>
      <textarea id="notes" rows="2" maxlength="300"></textarea>
      <div id="msg"></div>
      <button type="submit" id="saveBtn">Save</button>
      <button type="button" class="ghost" id="cancelBtn">Cancel</button>
    </form>

    <div class="tabs">
      <button id="tabOpen" class="on">To do</button>
      <button id="tabDone">Done</button>
    </div>

    <div id="list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
let me = null, all = [], showDone = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function today() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function daysUntil(s) { return Math.round((parseDate(s) - today()) / 86400000); }

function dueChip(t) {
  if (t.done) return `<span class="chip done">Done</span>`;
  if (!t.due_date) return `<span class="chip">No date</span>`;
  const n = daysUntil(t.due_date);
  if (n < 0) return `<span class="chip late">${-n} day${n === -1 ? "" : "s"} overdue</span>`;
  if (n === 0) return `<span class="chip soon">Due today</span>`;
  if (n === 1) return `<span class="chip soon">Due tomorrow</span>`;
  if (n <= 3) return `<span class="chip soon">Due in ${n} days</span>`;
  return `<span class="chip">Due in ${n} days</span>`;
}

async function load() {
  const { data, error } = await sb().from("tasks").select("*");
  if (error) { $("list").innerHTML = `<div class="empty">Could not load: ${esc(error.message)}</div>`; return; }
  all = data || [];
  render();
}

function render() {
  const open = all.filter(t => !t.done);
  $("sOpen").textContent = open.length;
  $("sLate").textContent = open.filter(t => t.due_date && daysUntil(t.due_date) < 0).length;
  $("sDone").textContent = all.length - open.length;

  let rows = all.filter(t => t.done === showDone);
  rows.sort((a, b) => {
    if (!a.due_date && !b.due_date) return new Date(b.created_at) - new Date(a.created_at);
    if (!a.due_date) return 1;
    if (!b.due_date) return -1;
    return showDone ? b.due_date.localeCompare(a.due_date) : a.due_date.localeCompare(b.due_date);
  });

  if (!rows.length) {
    $("list").innerHTML = `<div class="empty">${showDone ? "Nothing finished yet." : "Nothing to do. Add your first task."}</div>`;
    return;
  }
  $("list").innerHTML = rows.map(t => `
    <div class="card">
      <div>${dueChip(t)}<span class="chip">${esc(t.kind)}</span>${t.subject ? `<span class="chip">${esc(t.subject)}</span>` : ""}</div>
      <h3 style="margin-top:10px" class="${t.done ? "done-title" : ""}">${esc(t.title)}</h3>
      ${t.due_date ? `<p class="meta">${parseDate(t.due_date).toDateString()}</p>` : ""}
      ${t.notes ? `<p class="notes">${esc(t.notes)}</p>` : ""}
      <button onclick="toggle('${t.id}', ${!t.done})">${t.done ? "Mark as to do" : "Mark done ✓"}</button>
      <button class="ghost" onclick="del('${t.id}')">Delete</button>
    </div>`).join("");
}

async function toggle(id, done) {
  const { error } = await sb().from("tasks").update({ done }).eq("id", id);
  if (error) { alert(error.message); return; }
  load();
}
async function del(id) {
  if (!confirm("Delete this task?")) return;
  const { error } = await sb().from("tasks").delete().eq("id", id);
  if (error) { alert(error.message); return; }
  load();
}

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("saveBtn").disabled = true; $("msg").textContent = "";
  const { error } = await sb().from("tasks").insert({
    title: $("title").value.trim(),
    kind: $("kind").value,
    subject: $("subject").value.trim() || null,
    due_date: $("due").value || null,
    notes: $("notes").value.trim() || null
  });
  $("saveBtn").disabled = false;
  if (error) { $("msg").textContent = error.message; return; }
  $("addForm").reset(); $("addForm").style.display = "none";
  load();
});

$("toggleAdd").onclick = () => { $("addForm").style.display = "block"; $("addForm").scrollIntoView({ behavior: "smooth" }); };
$("cancelBtn").onclick = () => { $("addForm").style.display = "none"; };
$("tabOpen").onclick = () => { showDone = false; $("tabOpen").classList.add("on"); $("tabDone").classList.remove("on"); render(); };
$("tabDone").onclick = () => { showDone = true; $("tabDone").classList.add("on"); $("tabOpen").classList.remove("on"); render(); };

(async () => {
  const s = await getSession();
  if (!s) { $("gate").style.display = "block"; return; }
  me = s.user;
  $("app").style.display = "block";
  load();
})();
</script>
</body>
</html>
